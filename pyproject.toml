[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tb-office-word-mcp-server"
version = "1.4.0"
description = "Traffic Builders' MCP server for creating and manipulating Microsoft Word documents"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Traffic Builders"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2",
    "fastmcp>=2.8.1",
    "msoffcrypto-tool>=5.4.2",
    "docx2pdf>=0.1.8",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[project.urls]
"Homepage" = "https://github.com/tijevlam/Tb-Office-Word-MCP-Server"
"Bug Tracker" = "https://github.com/tijevlam/Tb-Office-Word-MCP-Server/issues"

[tool.hatch.build.targets.wheel]
only-include = [
    "word_document_server",
    "office_word_mcp_server",
]
sources = ["."]

[project.scripts]
word_mcp_server = "word_document_server.main:run_server"
